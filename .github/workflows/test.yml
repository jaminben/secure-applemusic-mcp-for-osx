name: tests

on:
  push:
    branches: [main, hardened]
  pull_request:
    branches: [main, hardened]
  workflow_dispatch:

jobs:
  invariants:
    # Runs FIRST and separately from the functional suite. These tests are the
    # point of the fork: they assert that the removed capabilities (Accessibility,
    # browser automation, Safari Apple-Events JS, the unofficial amp-api rail, URL
    # handoff to the OS) have not come back. A functional regression is a bug; an
    # invariant regression is the fork losing its reason to exist, so it gets its
    # own job and fails fast.
    name: capability invariants
    runs-on: ubuntu-latest
    steps:
      # Pinning policy inherited from upstream: first-party actions/* by tag;
      # third-party by verified SHA.
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --all-extras --dev

      - name: Capability invariants
        run: uv run pytest tests/test_capability_invariants.py tests/test_engine_resolution.py -q --no-cov

      - name: No removed dependency crept back
        # playwright/keyring/pyobjc were removed with the subsystems that used
        # them. A transitive reintroduction would widen the supply chain silently.
        run: |
          set -euo pipefail
          for pkg in playwright keyring pyobjc-framework-quartz; do
            if uv pip list 2>/dev/null | grep -iq "^${pkg} "; then
              echo "::error::removed dependency '${pkg}' is installed again"
              exit 1
            fi
          done
          echo "dependency surface clean"

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        env:
          PYVER: ${{ matrix.python-version }}
        run: uv python install "$PYVER"

      - name: Install project
        run: uv sync --all-extras --dev

      - name: Run tests + coverage
        # AppleScript-dependent tests auto-skip on non-darwin via pytestmark.
        # The runner is Linux, so the Apple Events path itself is exercised only
        # by the mocked tests here — see RELEASING.md for the macOS manual pass.
        run: uv run pytest tests/ -q --tb=short --cov=applemusic_mcp --cov-report=term-missing

  macos:
    # The whole point of this build is a macOS Apple-Events path, so at least
    # collect and run the suite on macOS too. Music.app automation itself needs
    # a real signed-in desktop session and stays behind the live gates.
    name: pytest (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short --no-cov

  fresh-install:
    name: fresh pip install (unpinned resolution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from source with unpinned resolution
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install .

      - name: Import the server
        run: |
          /tmp/fresh/bin/python - <<'PY'
          import applemusic_mcp
          from applemusic_mcp import server, rate_limit, cli  # noqa: F401
          print("imported OK:", applemusic_mcp.__version__)
          PY

      - name: Show what was resolved
        run: /tmp/fresh/bin/pip list
