name: publish

# Action pinning policy (matches github/github-mcp-server's practice):
#   - First-party orgs (actions/*, pypa/*): track tags / maintained branches.
#     Their tags auto-deliver the org's own security fixes; a stale SHA pin
#     with no Dependabot would never receive them.
#   - True third parties (astral-sh/*): pin to a verified commit SHA — tag
#     mutation on a compromised third-party repo is the real supply-chain risk.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # There is no PyPI job. This server is distributed as a notarized macOS app,
  # not a package: the signed MusicKit helper lives inside the .app bundle, and
  # `musickit._candidates()` finds it only there or in a source checkout. A
  # wheel therefore ships a build with NO MusicKit rail — no catalog adds — so
  # publishing one under this name would advertise the weakest version of the
  # product as the default install, to every directory that mirrors the
  # registry. It was also never actually working: the PyPI trusted publisher
  # has never been configured, so this job failed on v0.1.0, v0.1.1, v0.2.0 and
  # v0.2.1 while the registry job sat behind `needs: publish` and never ran.
  #
  # If a wrapper package ever ships — one that downloads or embeds the signed
  # app rather than pretending to be it — restore a build+publish job here and
  # add a `packages` entry to server.json. Until then the registry entry
  # carries the download URL in `_meta` instead. See RELEASING.md.

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # This job does NOT build the wheel. It cannot: the wheel carries a signed,
    # notarized .app, which needs a macOS runner, the Developer ID certificate
    # and the notary credentials — none of which exist in CI, and none of which
    # should. `make release-assets` builds it on the maintainer's Mac and
    # attaches it to the release; this uploads that exact artifact.
    #
    # Trusted publishing still applies. OIDC proves the upload came from this
    # repo, so there is no API token stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/project/secure-applemusic-mcp-for-osx/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch the wheel from this release
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # On a tag push GITHUB_REF_NAME is the tag. On workflow_dispatch it is
          # the BRANCH — so resolving the release from it looked for one called
          # "main" and found nothing. Fall back to the newest release, which is
          # what "publish the thing we just cut" means in that case.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
            echo "dispatched from ${GITHUB_REF_NAME}; using latest release ${tag}"
          fi
          # On a tag push this runs before the assets are uploaded — they are
          # built locally and attached afterwards. That is not a failure; it
          # means "run this again once the wheel is up", which is what
          # workflow_dispatch is for.
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --pattern '*.whl' --dir dist 2>/dev/null; then
            echo "No wheel attached to $tag yet — nothing to publish."
            echo "Attach it with: make release-assets SIGN_ID=... EXTRA=--upload"
            echo "then re-run this workflow (Actions -> publish -> Run workflow)."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ls -l dist

          # The wheel is built on a maintainer's Mac and attached to the
          # release, so it is NOT reproducible from this commit the way a
          # CI-built artifact would be. That is forced — the wheel carries a
          # signed, notarized .app and CI has no signing identity — but it means
          # the one thing this job CAN check is that the artifact matches the
          # release it claims to belong to. A wheel for the wrong version, stale
          # or otherwise, must not reach PyPI under this tag.
          want="${tag#v}"
          for whl in dist/*.whl; do
            got="$(basename "$whl" | cut -d- -f2)"
            if [ "$got" != "$want" ]; then
              echo "::error::$(basename "$whl") is version ${got}, but ${tag} expects ${want}."
              echo "::error::Refusing to publish a wheel that does not match its release."
              exit 1
            fi
            echo "verified: $(basename "$whl") matches ${tag}"
          done
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.fetch.outputs.found == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-dispatch after a successful upload must not fail the run.
          skip-existing: true

  registry:
    name: Publish to MCP Registry
    # AFTER PyPI, and only if it succeeded. server.json now declares a pypi
    # package, and the registry validates that the exact version exists on PyPI
    # before it will accept the entry. Running these in parallel raced: the
    # registry asked PyPI for 0.3.1 while the upload was still being indexed,
    # got a 404, and burned all three retries in 45 seconds.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      # OIDC proves the job runs in this repo, which is what authorizes the
      # io.github.jaminben/* namespace. No secret, no stored token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        # Third party, and a plain binary rather than an action. A release tag
        # and its assets are both mutable, so the version alone gives
        # reproducibility but no integrity — and this binary is then handed an
        # OIDC token with authority over the io.github.jaminben/* namespace.
        # Pin the digest too, per the policy at the top of this file. Bump both
        # deliberately.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Verify server.json agrees with the release
        # server.json has no other CI and does not follow an edit to
        # pyproject.toml, so it is exactly the surface that drifts. This is a
        # last check before advertising, not the gate that protects a release:
        # by now the tag, the GitHub Release, and PyPI have all happened. The
        # gate is the same script run pre-tag in release.yml.
        run: python3 scripts/check_versions.py

      - name: Wait for PyPI to serve this version
        # The registry validates the declared pypi package by fetching
        # pypi.org/pypi/<pkg>/<version>/json and treats a 404 as fatal. PyPI's
        # JSON API trails an upload by seconds to minutes, so poll rather than
        # race it. This step existed before, was removed with the PyPI job as
        # dead weight, and became load-bearing again the moment server.json
        # started declaring a package.
        run: |
          set -euo pipefail
          ver="$(python3 -c "import json;print(json.load(open('server.json'))['version'])")"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null \
                 "https://pypi.org/pypi/secure-applemusic-mcp-for-osx/${ver}/json"; then
              echo "PyPI is serving ${ver}"
              exit 0
            fi
            echo "attempt ${i}: PyPI has no ${ver} yet"
            sleep 10
          done
          echo "PyPI never served ${ver} — not registering an entry that points at nothing" >&2
          exit 1

      - name: Publish to MCP Registry
        # The registry answers 429/5xx as "likely transient, retry later", so
        # retry rather than leaving the entry a version behind. A duplicate is
        # treated as success: it means an earlier attempt landed and only the
        # response was lost, and republishing a version is impossible anyway.
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          for i in 1 2 3; do
            out=$(./mcp-publisher publish server.json 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            if echo "$out" | grep -q "duplicate version"; then
              echo "already published; treating as success"
              exit 0
            fi
            echo "publish attempt ${i} failed, retrying" >&2
            sleep 15
          done
          exit 1
